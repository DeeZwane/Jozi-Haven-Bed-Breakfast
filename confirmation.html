<script>
/* Reads the form values from the URL. Replace with an API call when a back end is added. */
(function(){var p=new URLSearchParams(location.search),s=document.getElementById("s"),
f=[["Name","name"],["Email","email"],["Check-in","checkin"],["Check-out","checkout"],["Guests","guests"],["Room","room"]];
f.forEach(function(x){var v=p.get(x[1]);if(v){var t=document.createElement("dt"),d=document.createElement("dd");t.textContent=x[0];d.textContent=v;s.append(t,d)}});
var sv=p.getAll("svc");if(sv.length){var t=document.createElement("dt"),d=document.createElement("dd");t.textContent="Services";d.textContent=sv.join(", ");s.append(t,d)}
})();
